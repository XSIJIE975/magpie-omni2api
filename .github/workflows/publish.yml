name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 自带 npm 10.x：trusted publishing 要求 ≥ 11.5.1
      - run: npm install -g npm@latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun test
      - name: version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 的 v$v 不一致"
            exit 1
          fi
      # 首次发布 0.1.0 用本地登录完成；此后由 Trusted Publisher（OIDC）发布，不需要 token
      - run: npm publish --provenance --access public
